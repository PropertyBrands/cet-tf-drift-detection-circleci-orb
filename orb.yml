version: 2.1
description: |
    Terragrunt run-all plan with drift email via SES. Includes SOPS, CircleCI IP ranges, and flexible exclude-dir handling.
display:
    home_url: https://github.com/PropertyBrands
    source_url: https://github.com/PropertyBrands/cet-tf-drift-detection-circleci-orb
orbs:
    aws-cli: circleci/aws-cli@5.4.0
commands:
    create_python_heredoc:
        description: Write out Python script into temporary location
        steps:
            - run:
                command: |
                    #!/bin/bash
                    # Write Python validation script to /tmp/validate_drift.py
                    # This file is AUTO-GENERATED by scripts/generate_python_wrapper.sh
                    # DO NOT EDIT MANUALLY - Edit src/scripts/validate_drift.py instead

                    cat > /tmp/validate_drift.py \<<'PYEOF'
                    #!/usr/bin/env python3
                    """
                    Script to validate Terraform drift changes against allowed resource type and key combinations.
                    Exits with error code 1 if any drift changes are not in the allowed list.

                    Usage:
                        python validate_drift.py <drift_file> [--allowed-changes <allowed_changes_file>]

                    Arguments:
                        drift_file                  Path to the drift changes JSON file
                        --allowed-changes           Optional path to a file containing allowed changes
                                                   (one per line in format 'resource_type:key')
                                                   If not provided, uses default hardcoded list
                    """

                    import json
                    import sys
                    import os
                    import argparse


                    def main():
                        # Set up argument parser.
                        parser = argparse.ArgumentParser(
                            description="Validate Terraform drift changes against allowed resource type and key combinations"
                        )
                        parser.add_argument("drift_file", help="Path to the drift changes JSON file")
                        parser.add_argument(
                            "--allowed-changes",
                            help="Path to a file containing allowed changes (one per line in format 'resource_type:key')",
                        )

                        # Parse arguments.
                        args = parser.parse_args()
                        drift_file = args.drift_file

                        # Load allowed changes from file or use defaults.
                        if args.allowed_changes:
                            # Load allowed changes from file.
                            if not os.path.exists(args.allowed_changes):
                                print(f"Error: {args.allowed_changes} not found", file=sys.stderr)
                                sys.exit(1)

                            try:
                                with open(args.allowed_changes, "r") as f:
                                    allowed_changes = [
                                        line.strip()
                                        for line in f
                                        if line.strip() and not line.strip().startswith("#")
                                    ]
                                print(
                                    f"Using custom list of allowed drift changes from file: {args.allowed_changes}"
                                )
                            except Exception as e:
                                print(f"Error reading {args.allowed_changes}: {e}", file=sys.stderr)
                                sys.exit(1)

                            if not allowed_changes:
                                print(
                                    f"Error: No valid allowed changes found in {args.allowed_changes}",
                                    file=sys.stderr,
                                )
                                sys.exit(1)
                        else:
                            # Default list of allowed resource_type:key combinations.
                            allowed_changes = [
                                "aws_eks_cluster:platform_version",
                                "aws_eks_addon:modified_at",
                                "aws_eks_access_policy_association:access_scope",
                            ]

                        # Check if file exists.
                        if not os.path.exists(drift_file):
                            print(f"Error: {drift_file} not found", file=sys.stderr)
                            sys.exit(1)

                        try:
                            # Load the drift changes JSON.
                            with open(drift_file, "r") as f:
                                drift_data = json.load(f)
                        except json.JSONDecodeError as e:
                            print(f"Error: Invalid JSON in {drift_file}: {e}", file=sys.stderr)
                            sys.exit(1)
                        except Exception as e:
                            print(f"Error reading {drift_file}: {e}", file=sys.stderr)
                            sys.exit(1)

                        # Print allowed changes for tracking purposes.
                        print(f"Checking drift against following allowed changes:")
                        for change in allowed_changes:
                            print(f"  - {change}")

                        # Track any violations.
                        violations = []

                        # Iterate over each drift object.
                        for drift_obj in drift_data:
                            resource_type = drift_obj.get("resource_type", "")
                            changed_keys = drift_obj.get("changed_keys", [])
                            address = drift_obj.get("address", "")

                            # Check each changed key.
                            for key in changed_keys:
                                change_identifier = f"{resource_type}:{key}"

                                if change_identifier not in allowed_changes:
                                    violations.append(
                                        {
                                            "address": address,
                                            "resource_type": resource_type,
                                            "changed_key": key,
                                            "change_identifier": change_identifier,
                                        }
                                    )

                        # Report results.
                        if violations:
                            print(
                                "\n❌  At least one drift change cannot be auto-adopted into Terraform state:",
                                file=sys.stderr,
                            )
                            print("", file=sys.stderr)

                            for violation in violations:
                                print(f"  Resource: {violation['address']}", file=sys.stderr)
                                print(f"  Type: {violation['resource_type']}", file=sys.stderr)
                                print(f"  Changed Key: {violation['changed_key']}", file=sys.stderr)
                                print(f"  Identifier: {violation['change_identifier']}", file=sys.stderr)
                                print("", file=sys.stderr)

                            sys.exit(1)
                        else:
                            print("\n✅  All drift changes can be auto-adopted into Terraform state")
                            print(f"Validated {len(drift_data)} drift objects")

                            # Show what was validated.
                            for drift_obj in drift_data:
                                resource_type = drift_obj.get("resource_type", "")
                                changed_keys = drift_obj.get("changed_keys", [])

                                for key in changed_keys:
                                    print(f"  ✓ {resource_type}:{key}")


                    if __name__ == "__main__":
                        main()
                    PYEOF

                    chmod +x /tmp/validate_drift.py
                name: Write Python script to temporary location
    install_dependencies:
        description: Install dependencies (bind-tools, jq, Python)
        steps:
            - run:
                command: |
                    #!/usr/bin/env bash
                    set -euo pipefail
                    apk add --no-cache bind-tools jq python3

                    # Create symlink for Python 3 to Python.
                    ln -sf /usr/bin/python3 /usr/bin/python
                    python --version
                name: Install dependencies
    install_sops:
        description: Install SOPS
        steps:
            - run:
                command: |
                    #!/usr/bin/env bash
                    set -e
                    apk add --no-cache curl
                    curl -sSLo /usr/local/bin/sops \
                      https://github.com/getsops/sops/releases/download/v3.10.2.linux.amd64
                    chmod +x /usr/local/bin/sops
                name: Install SOPS
executors:
    terragrunt:
        description: Terragrunt Docker executor
        docker:
            - image: << parameters.image >>
        parameters:
            image:
                default: alpine/terragrunt:1.12.2
                type: string
jobs:
    drift_detection:
        circleci_ip_ranges: true
        description: Run terragrunt run-all plan and send SES email on drift/failure
        executor:
            image: << parameters.terragrunt_image >>
            name: terragrunt
        parameters:
            account_id:
                type: string
            account_type:
                type: string
            auto_adopt_drift:
                default: true
                type: boolean
            auto_adopt_drift_dry_run:
                default: false
                type: boolean
            deployments_root:
                default: deployments
                type: string
            drift_email_from:
                type: string
            drift_email_from_name:
                default: Terraform Drift Detection
                type: string
            drift_email_to:
                type: string
            environment:
                type: string
            pre_approved_drift_file:
                default: ""
                type: string
            region:
                type: string
            role_name:
                type: string
            ses_region:
                type: string
            terragrunt_image:
                default: alpine/terragrunt:1.13.4
                type: string
            tg_queue_exclude_dirs:
                default: ""
                description: Comma-separated list of dirs to exclude from run-all
                type: string
        steps:
            - checkout
            - install_sops
            - install_dependencies
            - create_python_heredoc
            - aws-cli/setup:
                region: << parameters.region >>
                role_arn: arn:aws:iam::<< parameters.account_id >>:role/<< parameters.role_name >>
            - when:
                condition: << parameters.auto_adopt_drift >>
                steps:
                    - run:
                        command: |+
                            #!/usr/bin/env bash
                            # @brief Refresh all Terragrunt units and auto-adopt pre-approved drift changes into Terraform state.
                            set -euo pipefail

                            # Constants.
                            SCRIPT_PATH="${PWD}"
                            echo "SCRIPT_PATH: ${SCRIPT_PATH}"
                            TG_UNIT_FILE="terragrunt_units.txt"
                            TG_REFRESH_OUTDIR="${SCRIPT_PATH}/refresh/"

                            # Determine exclusions for Terragrunt find / run commands.
                            TF_FIND_FILTER_FLAGS=()
                            TF_RUN_QUEUE_EXCLUDE_DIRS=()
                            if [ -n "${TG_EXCLUDE_DIRS:-}" ]; then
                              # Read comma-separated list into array.
                              IFS=',' read -r -a _dirs \<<< "$TG_EXCLUDE_DIRS"

                              # Iterate over array and add --queue-exclude-dir flags.
                              for d in "${_dirs[@]}"; do
                                # Remove leading/trailing whitespace.
                                d="$(echo "$d" | xargs)"

                                # Only add flag if directory is not empty.
                                if [ -n "$d" ]; then
                                  TF_FIND_FILTER_FLAGS+=( --filter \!"$d" )
                                  TF_RUN_QUEUE_EXCLUDE_DIRS+=( --queue-exclude-dir "$d" )
                                fi
                              done
                            fi

                            # Determine Terragrunt units, exit if none found.
                            terragrunt find --experiment filter-flag "${TF_FIND_FILTER_FLAGS[@]}" > "${TG_UNIT_FILE}"
                            if [[ ! -s "${TG_UNIT_FILE}" ]]; then
                              printf "\n\nNo Terragrunt units found, exiting.\n"
                              exit 0
                            fi

                            printf "\n\nInitiate process to refresh all Terragrunt units and auto-adopt pre-approved drift changes into state.\n"
                            printf "Processing following Terragrunt units: \n%s\n" "$(cat ${TG_UNIT_FILE})"

                            # Run refresh on all units.
                            set +e
                            terragrunt run --all --parallelism 1 --non-interactive "${TF_RUN_QUEUE_EXCLUDE_DIRS[@]}" --out-dir "${TG_REFRESH_OUTDIR}" -- plan -refresh-only -detailed-exitcode
                            set -e

                            # Copy all Terraform plan files into their respective Terragrunt unit directories and convert them to a JSON file.
                            while read -r unit; do
                              ### Helper variables.
                              # Directory of the Terragrunt unit.
                              unit_dir="${SCRIPT_PATH}/${unit}"

                              # Refresh plan file in .tfplan format.
                              refresh_file_tfplan="${unit_dir}/refresh.tfplan"

                              # Refresh plan file in JSON format.
                              refresh_file_json="${unit_dir}/refresh.json"

                              # Drift file in JSON format.
                              drift_file_json="${unit_dir}/drift.json"

                              # Copy the refresh plan file to the unit directory.
                              cp "${TG_REFRESH_OUTDIR}/${unit}/tfplan.tfplan" "${refresh_file_tfplan}"

                              # Convert refresh.tfplan to a JSON file.
                              printf "\n\n\n==================================================\n"
                              printf "Processing Terraform unit: %s\n" "${unit}"
                              printf "Converting Terraform plan file to JSON for: %s\n" "${unit}"
                              terragrunt run --working-dir "${unit_dir}" -- show -json "${refresh_file_tfplan}" > "${refresh_file_json}"

                              # Check if any drift changes were found, otherwise skip to next unit.
                              has_drift_changes=$(jq 'has("resource_drift")' "${refresh_file_json}")
                              if [[ "$has_drift_changes" == "false" ]]; then
                                echo "No drift changes found, skipping to next Terragrunt unit"
                                continue
                              fi

                              # Extract drift into second JSON object for further processing.
                              jq '[.resource_drift[] | {
                                address: .address,
                                resource_type: (.address | split(".") | .[-2]),
                                changed_keys: [
                                  (.change.before // {}) as $before |
                                  (.change.after // {}) as $after |
                                  ([$before, $after] | add | keys_unsorted[]) as $key |
                                  select($before[$key] != $after[$key]) |
                                  $key
                                ]
                              }]' "${refresh_file_json}" > "${drift_file_json}"

                              # Check each drift change to see if it can be auto-adopted.
                              printf "Validating drift for: %s\n" "${unit}"
                              set +e
                              if [[ -n "${PRE_APPROVED_DRIFT_FILE:-}" ]]; then
                                # Determine absolute path to pre-approved drift file.
                                pre_approved_drift_file_abs="$(git rev-parse --show-toplevel || echo .)/${PRE_APPROVED_DRIFT_FILE}"
                                python3 /tmp/validate_drift.py "${drift_file_json}" --allowed-changes "${pre_approved_drift_file_abs}"
                              else
                                python3 /tmp/validate_drift.py "${drift_file_json}"
                              fi
                              python_exit_code="$?"
                              set -e

                              # Auto-adopt drift if all changes are on the list of allowed changes.
                              if [[ "${python_exit_code}" == "0" ]]; then
                                if [[ "${DRY_RUN:-}" == "1" ]]; then
                                  printf "\n\n==> Dry run: Skipping auto-remediation of drift (dry-run mode enabled)\n"
                                else
                                  printf "\n\n==> Auto-remediating drift by running apply with refresh-only\n"
                                  terragrunt run --working-dir "${unit_dir}" -- apply -refresh-only -auto-approve
                                fi
                              else
                                printf "\n\n==> Drift cannot be auto-remediated\n"
                              fi

                            done < "${TG_UNIT_FILE}"

                        environment:
                            DRY_RUN: << parameters.auto_adopt_drift_dry_run >>
                            PRE_APPROVED_DRIFT_FILE: << parameters.pre_approved_drift_file >>
                            TG_EXCLUDE_DIRS: << parameters.tg_queue_exclude_dirs >>
                        name: Attempt to automatically adopt drift into state based on list of approved changes
                        working_directory: << parameters.deployments_root >>/<< parameters.account_type >>/<< parameters.region >>/<< parameters.environment >>
            - unless:
                condition: << parameters.auto_adopt_drift >>
                steps:
                    - run:
                        command: echo "Skipping automatic drift adoption into state"
                        name: Skip attempt to automatically adopt drift based on list of approved changes
            - run:
                command: |
                    #!/usr/bin/env bash
                    set -euo pipefail

                    # Build exclude flag for run-all
                    EXTRA_ARGS=()
                    if [ -n "${TG_QUEUE_EXCLUDE_DIRS:-}" ]; then
                      IFS=',' read -r -a _dirs \<<< "$TG_QUEUE_EXCLUDE_DIRS"
                      for d in "${_dirs[@]}"; do
                        d="$(echo "$d" | xargs)"
                        [ -n "$d" ] && EXTRA_ARGS+=( --queue-exclude-dir "$d" )
                      done
                    fi

                    # Fetch the account name (alias) and if missing use account_id
                    ACCOUNT_ALIAS=$(aws iam list-account-aliases --query 'AccountAliases[0]' --output text 2>/dev/null || true)
                    # Convert to empty string if None is returned
                    if [ "$ACCOUNT_ALIAS" = "None" ] || [ -z "$ACCOUNT_ALIAS" ]; then
                      ALIAS="$ACCOUNT_ID"
                    else
                      ALIAS="$ACCOUNT_ALIAS"
                    fi

                    # Run tg plan and capture the exit code
                    set +e
                    terragrunt run --all --parallelism 1 --non-interactive "${EXTRA_ARGS[@]}" -- plan -detailed-exitcode
                    TG_STATUS=$?
                    set -e

                    # Helper to send a minimal SES email with jq
                    send_mail() {
                        subj="$1"
                        body="$2"
                        FROM_COMPOSED="${DRIFT_EMAIL_FROM_NAME} <${DRIFT_EMAIL_FROM}>"

                        jq -n --arg s "$subj" --arg b "$body" \
                            '{Subject:{Data:$s}, Body:{Text:{Data:$b}}}' > /tmp/message.json

                        # Ensure we don't sign with assumed-role tokens
                        unset AWS_SESSION_TOKEN AWS_SECURITY_TOKEN AWS_PROFILE AWS_ROLE_ARN AWS_WEB_IDENTITY_TOKEN_FILE

                        AWS_ACCESS_KEY_ID="$SES_LOGIN" \
                        AWS_SECRET_ACCESS_KEY="$SES_PASSWORD" \
                        AWS_DEFAULT_REGION="$SES_REGION" \
                        aws ses send-email \
                            --from "$FROM_COMPOSED" \
                            --destination "ToAddresses=$DRIFT_EMAIL_TO" \
                            --message file:///tmp/message.json \
                        || echo "WARN: SES send failed"
                    }

                    case "$TG_STATUS" in
                      2)
                        SUBJECT="[TF] Drift detected in ${ALIAS} account (environment: ${ENVIRONMENT})"
                        BODY=$(printf '%s\nAWS Account Name: %s\nAWS Account ID: %s\nAWS Region: %s\nAccount Type: %s\nEnvironment: %s\nPipeline: %s\n' \
                          "Drift detected:" \
                          "$ALIAS" \
                          "$ACCOUNT_ID" \
                          "$REGION" \
                          "$ACCOUNT_TYPE" \
                          "$ENVIRONMENT" \
                          "${CIRCLE_BUILD_URL:-N/A}")
                        send_mail "$SUBJECT" "$BODY"
                        echo "Drift detected in the Terragrunt plan. SES notification sent."
                        exit 2
                        ;;
                      0)
                        echo "No drift. Plan OK."
                        ;;
                      *)
                        SUBJECT="[TF] Terragrunt plan failed in ${ALIAS} account (environment: ${ENVIRONMENT})"
                        BODY=$(printf 'Terragrunt plan failed (exit code %s)\nAWS Account Name: %s\nAWS Account ID: %s\nAWS Region: %s\nAccount Type: %s\nEnvironment: %s\nPipeline: %s\n' \
                          "$TG_STATUS" \
                          "$ALIAS" \
                          "$ACCOUNT_ID" \
                          "$REGION" \
                          "$ACCOUNT_TYPE" \
                          "$ENVIRONMENT" \
                          "${CIRCLE_BUILD_URL:-N/A}")
                        send_mail "$SUBJECT" "$BODY"
                        echo "Terragrunt Plan failed. SES notification sent."
                        exit "$TG_STATUS"
                        ;;
                    esac
                environment:
                    ACCOUNT_ID: << parameters.account_id >>
                    ACCOUNT_TYPE: << parameters.account_type >>
                    DRIFT_EMAIL_FROM: << parameters.drift_email_from >>
                    DRIFT_EMAIL_FROM_NAME: << parameters.drift_email_from_name >>
                    DRIFT_EMAIL_TO: << parameters.drift_email_to >>
                    ENVIRONMENT: << parameters.environment >>
                    REGION: << parameters.region >>
                    SES_REGION: << parameters.ses_region >>
                    TG_QUEUE_EXCLUDE_DIRS: << parameters.tg_queue_exclude_dirs >>
                name: Run Terragrunt plan and email on drift (<< parameters.region >>/<< parameters.environment >>)
                working_directory: << parameters.deployments_root >>/<< parameters.account_type >>/<< parameters.region >>/<< parameters.environment >>
examples:
    drift_detection:
        description: Dry-run drift-detection usage example
        usage:
            version: "2.1"
            orbs:
                tf-drift-detection: iiq/tf-drift-detection@1.0.1
            workflows:
                demo:
                    jobs:
                        - tf-drift-detection/drift_detection:
                            account_id: "12345678912"
                            account_type: dev
                            context: any-context
                            drift_email_from: your-ses@domain.com
                            drift_email_to: your-receipient-dl@domain.com
                            environment: dev
                            name: terragrunt-plan-us-east-1-development
                            region: us-east-1
                            ses_region: us-east-2
                            tg_queue_exclude_dirs: api-gateway

