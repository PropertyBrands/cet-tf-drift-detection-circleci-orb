description: "Run terragrunt run-all plan and send SES email on drift/failure"
# Use CircleCI IP ranges so EKS public endpoint allowlists can authorize the runner's egress IPs.
circleci_ip_ranges: true
parameters:
  # Deployment details
  region:
    type: string
  account_type:
    type: string
  environment:
    type: string
  account_id:
    type: string
  # Repo structure + AWS role name
  deployments_root:
    type: string
    default: "deployments"
  role_name:
    type: string
  # Container image
  terragrunt_image:
    type: string
    default: "alpine/terragrunt:1.13.4"
  # Terragrunt exclusions
  tg_queue_exclude_dirs:
    description: "Comma-separated list of dirs to exclude from run-all"
    type: string
    default: ""
  # Email / SES
  drift_email_to:
    type: string
  drift_email_from:
    type: string
  drift_email_from_name:
    type: string
    default: "Terraform Drift Detection"
  ses_region:
    type: string
  auto_adopt_drift:
    type: boolean
    default: true
  auto_adopt_drift_dry_run:
    type: boolean
    default: false
  pre_approved_drift_file:
    type: string
    default: ""
executor:
  name: terragrunt
  image: << parameters.terragrunt_image >>
steps:
  - checkout
  - install_sops
  - install_dependencies
  - create_python_heredoc
  - aws-cli/setup:
      role_arn: arn:aws:iam::<< parameters.account_id >>:role/<< parameters.role_name >>
      region: << parameters.region >>
  - when:
      condition: << parameters.auto_adopt_drift >>
      steps:
        - run:
            name: Attempt to automatically adopt drift into state based on list of approved changes
            working_directory: << parameters.deployments_root >>/<< parameters.account_type >>/<< parameters.region >>/<< parameters.environment >>
            environment:
              TG_EXCLUDE_DIRS: << parameters.tg_queue_exclude_dirs >>
              PRE_APPROVED_DRIFT_FILE: << parameters.pre_approved_drift_file >>
              DRY_RUN: << parameters.auto_adopt_drift_dry_run >>
            command: <<include(scripts/auto_adopt_drift.sh)>>
  - unless:
      condition: << parameters.auto_adopt_drift >>
      steps:
        - run:
            name: Skip attempt to automatically adopt drift based on list of approved changes
            command: echo "Skipping automatic drift adoption into state"
  - run:
      name: Run Terragrunt plan and email on drift (<< parameters.region >>/<< parameters.environment >>)
      working_directory: << parameters.deployments_root >>/<< parameters.account_type >>/<< parameters.region >>/<< parameters.environment >>
      environment:
        # ENV Vars
        REGION: << parameters.region >>
        ENVIRONMENT: << parameters.environment >>
        ACCOUNT_TYPE: << parameters.account_type >>
        ACCOUNT_ID: << parameters.account_id >>
        TG_QUEUE_EXCLUDE_DIRS: << parameters.tg_queue_exclude_dirs >>
        # Email / SES Vars
        DRIFT_EMAIL_TO: << parameters.drift_email_to >>
        DRIFT_EMAIL_FROM: << parameters.drift_email_from >>
        DRIFT_EMAIL_FROM_NAME: << parameters.drift_email_from_name >>
        SES_REGION: << parameters.ses_region >>
      command: <<include(scripts/run_drift_detection.sh)>>
